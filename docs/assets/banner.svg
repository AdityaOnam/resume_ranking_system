<svg viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="55%" stop-color="#0e1424"/>
      <stop offset="100%" stop-color="#0b0f1a"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161d30"/>
      <stop offset="100%" stop-color="#121729"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <circle cx="980" cy="90" r="220" fill="url(#glow1)"/>
  <circle cx="150" cy="340" r="180" fill="url(#glow2)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
  </g>

  <!-- eyebrow -->
  <g transform="translate(64,72)">
    <rect x="0" y="0" width="9" height="9" fill="#818cf8"/>
    <text x="20" y="9" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="3" fill="#a5b4fc">RESUME INTELLIGENCE PLATFORM</text>
  </g>

  <!-- title -->
  <text x="60" y="185" font-family="Georgia, 'Times New Roman', serif" font-size="86" font-weight="700" fill="url(#titleGrad)">Resume Ranker</text>

  <!-- tagline -->
  <text x="64" y="230" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#94a3b8">Parse. Score. Match. Rank &#8212; powered by embeddings, cross-encoders &amp; Groq AI.</text>

  <!-- feature pills -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#cbd5e1">
    <g transform="translate(64,264)">
      <rect width="96" height="34" rx="17" fill="url(#cardGrad)" stroke="#2a3350"/>
      <text x="48" y="22" text-anchor="middle">FastAPI</text>
    </g>
    <g transform="translate(172,264)">
      <rect width="86" height="34" rx="17" fill="url(#cardGrad)" stroke="#2a3350"/>
      <text x="43" y="22" text-anchor="middle">React</text>
    </g>
    <g transform="translate(270,264)">
      <rect width="104" height="34" rx="17" fill="url(#cardGrad)" stroke="#2a3350"/>
      <text x="52" y="22" text-anchor="middle">Supabase</text>
    </g>
    <g transform="translate(386,264)">
      <rect width="118" height="34" rx="17" fill="url(#cardGrad)" stroke="#2a3350"/>
      <text x="59" y="22" text-anchor="middle">Groq LLM</text>
    </g>
    <g transform="translate(516,264)">
      <rect width="150" height="34" rx="17" fill="url(#cardGrad)" stroke="#2a3350"/>
      <text x="75" y="22" text-anchor="middle">Sentence-Transformers</text>
    </g>
    <g transform="translate(678,264)">
      <rect width="128" height="34" rx="17" fill="url(#cardGrad)" stroke="#2a3350"/>
      <text x="64" y="22" text-anchor="middle">Docker + AWS</text>
    </g>
  </g>

  <!-- credit -->
  <text x="64" y="352" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1" fill="#64748b">DESIGNED &amp; MAINTAINED BY ADITYA ONAM</text>

  <!-- right side icon: radar / match target -->
  <g transform="translate(1000,205)">
    <circle r="115" fill="none" stroke="#334155" stroke-width="1.5"/>
    <circle r="85" fill="none" stroke="#334155" stroke-width="1.5"/>
    <circle r="55" fill="none" stroke="#334155" stroke-width="1.5"/>
    <circle r="55" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="6 10" opacity="0.7"/>
    <circle r="6" fill="#818cf8"/>
    <circle cx="62" cy="-38" r="7" fill="#22d3ee"/>
    <circle cx="-70" cy="24" r="5" fill="#c084fc"/>
    <circle cx="30" cy="80" r="4.5" fill="#a5b4fc"/>
    <line x1="0" y1="0" x2="62" y2="-38" stroke="#22d3ee" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="0" x2="-70" y2="24" stroke="#c084fc" stroke-width="1.5" opacity="0.6"/>
  </g>
</svg>
