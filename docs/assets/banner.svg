<svg viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="vignette" cx="78%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#9184d9" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#9184d9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- rr-bg -->
  <rect width="1280" height="400" fill="#161826"/>
  <rect width="1280" height="400" fill="url(#vignette)"/>

  <!-- eyebrow: accent divider + tracked uppercase label, matching Dashboard.jsx's eyebrow pattern -->
  <g transform="translate(64,64)" font-family="Inter, Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="18" height="1" fill="#9184d9"/>
    <text x="26" y="4" font-size="11" letter-spacing="2.2" fill="#8e91a1">RESUME INTELLIGENCE</text>
  </g>

  <!-- title, same weight/tracking family as Dashboard.jsx h1 (font-display, tracking -0.025em) -->
  <text x="60" y="188" font-family="Inter, Helvetica, Arial, sans-serif" font-size="72" font-weight="600" letter-spacing="-1.5" fill="#e9e9ed">Resume Ranker</text>

  <!-- tagline, rr-muted -->
  <text x="64" y="228" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#8e91a1">Upload once. We parse, embed, score against every open role, and rank the</text>
  <text x="64" y="252" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#8e91a1">matches &#8212; with the gaps spelled out.</text>

  <!-- pills styled like the app's own badges: surface-2 fill, line border, muted text -->
  <g font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8e91a1">
    <g transform="translate(64,286)">
      <rect width="88" height="32" rx="16" fill="#222534" stroke="#2e3140"/>
      <text x="44" y="21" text-anchor="middle">FastAPI</text>
    </g>
    <g transform="translate(164,286)">
      <rect width="78" height="32" rx="16" fill="#222534" stroke="#2e3140"/>
      <text x="39" y="21" text-anchor="middle">React</text>
    </g>
    <g transform="translate(254,286)">
      <rect width="96" height="32" rx="16" fill="#222534" stroke="#2e3140"/>
      <text x="48" y="21" text-anchor="middle">Supabase</text>
    </g>
    <g transform="translate(362,286)">
      <rect width="86" height="32" rx="16" fill="#222534" stroke="#2e3140"/>
      <text x="43" y="21" text-anchor="middle">Groq AI</text>
    </g>
    <g transform="translate(460,286)">
      <rect width="140" height="32" rx="16" fill="#222534" stroke="#2e3140"/>
      <text x="70" y="21" text-anchor="middle">Docker + AWS</text>
    </g>
  </g>

  <!-- credit line -->
  <text x="64" y="352" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#42475e">DESIGNED &amp; MAINTAINED BY ADITYA ONAM</text>

  <!-- right side: recreation of the app's own "Pipeline" step tracker card -->
  <g transform="translate(900,72)">
    <rect width="320" height="256" rx="16" fill="#1d1f2c" stroke="#2e3140"/>
    <line x1="0" y1="52" x2="320" y2="52" stroke="#2e3140"/>
    <text x="20" y="33" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#e9e9ed">Pipeline</text>
    <g transform="translate(268,20)">
      <circle r="3" fill="#9184d9"/>
      <text x="10" y="4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="10" letter-spacing="1" fill="#8e91a1">DONE</text>
    </g>

    <!-- step rows -->
    <g font-family="Inter, Helvetica, Arial, sans-serif">
      <!-- step 1: done -->
      <g transform="translate(20,80)">
        <circle cx="11" cy="0" r="11" fill="#9184d9" fill-opacity="0.12" stroke="#9184d9"/>
        <path d="M6,0 L9.5,4 L16,-4" stroke="#9184d9" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="11" y1="11" x2="11" y2="46" stroke="#9184d9"/>
        <text x="34" y="4" font-size="14" fill="#e9e9ed">Parse</text>
        <text x="34" y="22" font-size="12" fill="#8e91a1">Extracting sections, skills and dates.</text>
      </g>

      <!-- step 2: done -->
      <g transform="translate(20,146)">
        <circle cx="11" cy="0" r="11" fill="#9184d9" fill-opacity="0.12" stroke="#9184d9"/>
        <path d="M6,0 L9.5,4 L16,-4" stroke="#9184d9" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="11" y1="11" x2="11" y2="46" stroke="#9184d9"/>
        <text x="34" y="4" font-size="14" fill="#e9e9ed">Embed</text>
        <text x="34" y="22" font-size="12" fill="#8e91a1">Generating vectors and the ATS score.</text>
      </g>

      <!-- step 3: active -->
      <g transform="translate(20,212)">
        <circle cx="11" cy="0" r="11" fill="none" stroke="#9184d9"/>
        <circle cx="11" cy="0" r="3.2" fill="#9184d9"/>
        <text x="34" y="4" font-size="14" fill="#e9e9ed">Rank</text>
        <text x="34" y="22" font-size="12" fill="#8e91a1">Scoring against every indexed company.</text>
      </g>
    </g>
  </g>
</svg>
